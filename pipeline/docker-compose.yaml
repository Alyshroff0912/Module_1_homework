services:
  homeworkdatabase:
    image: postgres:16
    container_name: homeworkdatabase2
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ny_taxi
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  
    networks:
      - homework-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-new
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: 1
    ports:
      - "8086:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - homework-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  homework-network:
